  function glue(root){
    if(!root) return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), n, re1=/(\d) (?=\d)/g, re2=/ (₽|%|м²|м³|кВт·ч|тыс\.|млн|шт|ч\b|Вт)/g, re3=/(№|ст\.|ч\.|п\.) (?=\d)/g, re4=/(\d) (?=(₽|тыс|кв|м²|м³|кВт|руб|года?|лет|дн))/g;
    var re5=/(\d)–(\d)/g;
    while((n=w.nextNode())){ var pn=n.parentNode&&n.parentNode.nodeName; if(pn==='TEXTAREA'||pn==='PRE'||pn==='OPTION'||pn==='SCRIPT'||pn==='STYLE') continue; var t=n.nodeValue, u=t.replace(re1,'$1\u00a0').replace(re4,'$1\u00a0').replace(re2,'\u00a0$1').replace(re3,'$1\u00a0').replace(re5,'$1\u2060–\u2060$2'); if(u!==t) n.nodeValue=u; }
  }

  function zhCalcBudget(){
    var el=document.getElementById('zhBudgetResults');if(!el)return;
    var v=function(id){var e=document.getElementById(id);return Math.max(0,Number(e&&e.value)||0)};
    var sal=v('zhSalary'),acct=v('zhAccount');
    var mode=document.getElementById('zhAreaMode').value;
    var area=Math.max(1,mode==='egrn'?v('zhAreaEgrn'):v('zhAreaProtocol'));
    var ndfl=sal*.13, ins=sal*v('zhInsurance')/100, inj=sal*v('zhInjury')/100;
    var payroll=(sal+ins+inj+acct)*12;
    var other=0;document.querySelectorAll('.zhcost').forEach(function(input){other+=Math.max(0,Number(input.value)||0)});
    var normative=area*v('zhWasteNorm')*v('zhWasteCoef'), factVol=v('zhWasteBin')*v('zhWasteTrips'),waste=factVol? v('zhWasteTrips')*v('zhWastePrice'):0;
    var lightKwh=v('zhLights')*v('zhLightW')/1000*v('zhLightH')*365;
    var gateKwh=v('zhGateKwh'); var camerasKwh=v('zhCameras')*v('zhCameraW')/1000*24*365;
    var lightCost=lightKwh*v('zhKwhPrice'),gateCost=gateKwh*v('zhKwhPrice')+v('zhGateMaint'), cameraCost=camerasKwh*v('zhKwhPrice')+v('zhCameraMaint');
    var l=document.getElementById('zhLightOut');if(l)l.innerHTML='<p>Лампы: <b>'+lightKwh.toLocaleString('ru-RU',{maximumFractionDigits:2})+' кВт·ч</b> = <b>'+zhMoney(lightCost)+'</b> в год.</p><p>Ворота: <b>'+zhMoney(gateCost)+'</b>; камеры: <b>'+zhMoney(cameraCost)+'</b> в год.</p><p><b>Всего свет, ворота, камеры: '+zhMoney(lightCost+gateCost+cameraCost)+'</b>.</p>';
    var w=document.getElementById('zhWasteOut');if(w)w.innerHTML='<p>Нормативный объём для выбранной площади '+area.toLocaleString('ru-RU')+' м²: <b>'+normative.toLocaleString('ru-RU',{maximumFractionDigits:3})+' м³/год</b>.</p><p>По бункерам: <b>'+v('zhWasteTrips')+' × '+v('zhWasteBin')+' = '+factVol.toLocaleString('ru-RU',{maximumFractionDigits:2})+' м³/год</b>; стоимость <b>'+zhMoney(waste)+'</b>.</p><p>Разница фактического планового объёма и нормативного: <b>'+(factVol-normative).toLocaleString('ru-RU',{maximumFractionDigits:3})+' м³</b>. Эти объёмы рассчитываются разными способами.</p>';
    var total=payroll+other+waste+lightCost+gateCost+cameraCost;
    el.innerHTML='<p>Выбранная площадь: <b>'+area.toLocaleString('ru-RU')+' м²</b> ('+(mode==='egrn'?'ЕГРН':'протоколы')+').</p>'+
     '<p>Председателю на руки: <b>'+zhMoney(sal-ndfl)+'</b> в месяц; НДФЛ: <b>'+zhMoney(ndfl)+'</b>; взносы работодателя: <b>'+zhMoney(ins+inj)+'</b> в месяц.</p>'+
     '<p>Управление и бухгалтерия за год: <b>'+zhMoney(payroll)+'</b>.</p>'+
     '<p>Мусор за год: <b>'+zhMoney(waste)+'</b>; лампы, ворота, камеры: <b>'+zhMoney(lightCost+gateCost+cameraCost)+'</b>.</p>'+
     '<p>Остальные статьи: <b>'+zhMoney(other)+'</b>.</p>'+
     '<p style="font-size:1.15em"><b>ВСЕГО: '+zhMoney(total)+'</b></p>'+
     '<p>Ставка на 1 м² в год: <b>'+(total/area).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽</b>; за сотку: <b>'+zhMoney(total*100/area)+'</b>.</p>';
  }
